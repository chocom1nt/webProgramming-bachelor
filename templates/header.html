<script>
    const IMAGE_NOT_FOUND = '<?= defined('IMAGE_NOT_FOUND') ? IMAGE_NOT_FOUND : '/include/img/ImageNotFound.png' ?>';
    
    // Управление темой
    document.addEventListener('DOMContentLoaded', function() {
        const themeToggle = document.getElementById('themeToggle');
        const themeStyle = document.getElementById('theme-style');
        const savedTheme = localStorage.getItem('theme') || 'light';
        
        // Применяем сохраненную тему
        if (savedTheme === 'dark') {
            themeStyle.href = '/css/dark-theme.css';
            if (themeToggle) themeToggle.textContent = '☀️';
        } else {
            themeStyle.href = '/css/light-theme.css';
            if (themeToggle) themeToggle.textContent = '🌙';
        }
        
        // Переключение темы
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                const currentTheme = themeStyle.href.includes('dark') ? 'dark' : 'light';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                if (newTheme === 'dark') {
                    themeStyle.href = '/css/dark-theme.css';
                    this.textContent = '☀️';
                } else {
                    themeStyle.href = '/css/light-theme.css';
                    this.textContent = '🌙';
                }
                
                localStorage.setItem('theme', newTheme);
            });
        }
    });
</script>
